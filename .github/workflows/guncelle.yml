name: Günlük güncelleme

on:
  schedule:
    # GitHub zamanlanmış işleri saat başlarında geciktirebiliyor; iki deneme yapılır
    - cron: '11 13 * * *'  # 16:11 Türkiye saati
    - cron: '11 14 * * *'  # 17:11 Türkiye saati
  workflow_dispatch:        # GitHub sayfasından elle de çalıştırılabilir

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages adresini öğren
        id: sayfa
        uses: actions/configure-pages@v5
      - name: Verileri topla
        env:
          ONCEKI_URL: ${{ steps.sayfa.outputs.base_url }}/veri.json
        run: node topla.js
      - name: Günün yorumunu yaz
        run: node yorum.js
      - name: Yayın klasörünü hazırla
        run: node site-olustur.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Yayınla
        id: yayin
        uses: actions/deploy-pages@v4
